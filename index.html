<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <link rel="stylesheet" href="w.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>
<body>
    <div class="card">


    <div class="search">
    <input id="city" type="text" placeholder="Enter city name" spellcheck="false">
    <img class="searchButton" src="/img/web.png" alt="search">
    

</div>
<div class="weather">
    <img id="icon" src="" alt="">
    <h1 class="temp">22°c</h1>
    <h2 class="city">new york</h2>
    <div class="details">
        <div class="col">
            <img src="img/drop.png" alt="">

            <div>
                <p class="humidity">50%</p>
                <p>humidity</p>
            </div>
        </div>
        <div class="col">
            <img src="https://cdn.iconscout.com/icon/free/png-256/free-wind-icon-download-in-svg-png-gif-file-formats--weather-blowing-winds-breeze-nature-pack-icons-1135796.png?f=webp&w=256" alt="">

            
            <div>
                <p class="wind">15 km/h</p>
                <p>wind speed</p>
    </div>

</div>

</div>
</div>
<script src="w.js"></script>

</body>
</html>
